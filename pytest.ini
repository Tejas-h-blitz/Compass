[pytest]
testpaths = tests
pythonpath = .
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
# Ignore pipeline scripts that wipe/reset the database sequentially; run them via run_all_tests.py
addopts = -ra -q --ignore=tests/test_step1.py --ignore=tests/test_step2.py --ignore=tests/test_step3.py --ignore=tests/test_step4.py --ignore=tests/test_step5.py

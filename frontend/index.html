<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compass - Agentic Desktop Search</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Local CSS Link -->
    <link rel="stylesheet" href="/static/index.css?v=2.3">
</head>
<body>
    <div class="app-layout">
        <!-- 1. Left Sidebar Navigation -->
        <aside class="sidebar">
            <!-- Brand Section -->
            <div class="sidebar-header">
                <div class="brand">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <span class="app-title">Compass</span>
                        <span class="app-badge">Desktop Search</span>
                    </div>
                </div>
            </div>

            <!-- Monitored Horizons Section (Scrollable main body) -->
            <div class="sidebar-main">
                <div class="sidebar-section">
                    <div class="section-header">
                        <span class="section-title">Monitored Folders</span>
                        <span id="horizon-count-badge" class="count-badge">0</span>
                    </div>

                    <!-- Monitored list container -->
                    <div id="horizons-list" class="horizons-list"></div>

                    <!-- Add folder input -->
                    <div class="add-horizon-box">
                        <input type="text" id="scan-path-input" placeholder="Add path (e.g. D:\Projects)">
                        <button id="btn-add-horizon" class="btn-add" title="Add Folder">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Scope & Security Card -->
                <div class="scope-info-card">
                    <div class="scope-icon">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </div>
                    <div class="scope-text">
                        <span class="scope-title">Protected Storage</span>
                        <span class="scope-desc">Local-only · Sensitive keys filtered</span>
                    </div>
                </div>
            </div>

            <!-- Lower Section: Dedicated Index & Sync Panel -->
            <div class="sidebar-bottom">
                <div class="index-panel">
                    <div class="index-panel-header">
                        <span class="index-panel-title">Index Engine</span>
                        <span id="index-status-pill" class="index-status-pill">Ready</span>
                    </div>
                    <div class="index-metrics">
                        <span class="metric-num" id="stat-files-count">0</span>
                        <span class="metric-txt">files in database</span>
                    </div>

                    <!-- Scan Actions -->
                    <div class="scan-actions">
                        <button id="btn-scan" class="btn-scan">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                            <span>Scan Folders</span>
                        </button>
                        <button id="btn-scan-force" class="btn-reindex" title="Force complete re-indexing">
                            Re-index
                        </button>
                    </div>

                    <!-- Status / Notification -->
                    <div id="scan-status" class="scan-status hidden">
                        <div class="mini-spinner"></div>
                        <span id="scan-status-text">Scanning directories...</span>
                    </div>
                    <div id="scan-result" class="scan-result hidden">
                        <span id="scan-result-details">Scanned 0 files</span>
                    </div>
                </div>

                <!-- Sidebar Footer -->
                <div class="sidebar-footer">
                    <div class="privacy-status" title="Local search engine with automatic zero-trust filtering for keys and private data">
                        <span class="status-dot"></span>
                        <span class="privacy-label">Local & Private</span>
                    </div>
                    <span class="version-tag">v2.0</span>
                </div>
            </div>
        </aside>

        <!-- 2. Main Search Area -->
        <main class="main-content">
            <section class="search-panel">
                <!-- Spotlight Search Bar -->
                <div class="search-header">
                    <div class="search-bar">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="search-input" placeholder="Search files, contents, or concepts..." autocomplete="off" spellcheck="false">
                        <div class="search-shortcuts">
                            <kbd class="shortcut-key">Esc</kbd>
                        </div>
                    </div>

                    <div class="search-options">
                        <label class="toggle-control" title="Show smart file recommendations when query is empty">
                            <input type="checkbox" id="suggestions-toggle">
                            <span class="toggle-switch"></span>
                            <span class="toggle-text">Suggestions</span>
                        </label>
                    </div>
                </div>

                <!-- Minimalist Search Status / Metadata Bar -->
                <div id="router-feedback-panel" class="search-status-bar hidden">
                    <div class="status-left">
                        <span id="results-count-text" class="status-count">Results</span>
                    </div>
                    <div class="status-right">
                        <span id="router-strategy-badge" class="strategy-badge">Instant</span>
                        <span id="router-latency-value" class="latency-badge">0.0 ms</span>
                    </div>
                </div>

                <!-- Results & Recommendations View -->
                <div class="results-container">
                    <div id="results-list" class="results-list">
                        <!-- Initial state rendered dynamically by app.js -->
                    </div>
                </div>

                <!-- Keyboard Navigation Footer Bar -->
                <div class="keyboard-hints-bar">
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>↑</kbd><kbd>↓</kbd></span>
                        <span class="hint-label">Navigate</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>↵</kbd></span>
                        <span class="hint-label">Open File</span>
                    </div>
                    <div class="hint-group">
                        <span class="hint-keys"><kbd>Esc</kbd></span>
                        <span class="hint-label">Clear</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Local JS Link -->
    <script src="/static/app.js?v=2.3"></script>
</body>
</html>
